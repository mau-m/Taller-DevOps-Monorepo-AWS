name: Build images and deploy to AWS

on:
  push:
    branches:
      - 'main'
  
permissions:
  id-token: write
  contents: read

jobs:
  backend-build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar credenciales AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Autenticar Docker con ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen Backend
        env:
          BACKEND_ECR_REGISTRY: ${{ vars.BACKEND_ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $BACKEND_ECR_REGISTRY:$IMAGE_TAG \
            -t $BACKEND_ECR_REGISTRY:latest \
            ./backend/.
          docker push $BACKEND_ECR_REGISTRY:$IMAGE_TAG
          docker push $BACKEND_ECR_REGISTRY:latest

      - name: Escribir summary del job (Backend)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "## Resumen del job - Backend" >> $GITHUB_STEP_SUMMARY
          echo "- Job: ${GITHUB_JOB}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${JOB_STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "- Image tag: ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
  
  frontend-build:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar credenciales AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Autenticar Docker con ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen Frontend
        env:
          FRONTEND_ECR_REGISTRY: ${{ vars.FRONTEND_ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $FRONTEND_ECR_REGISTRY:$IMAGE_TAG \
            -t $FRONTEND_ECR_REGISTRY:latest \
            ./frontend/.
          docker push $FRONTEND_ECR_REGISTRY:$IMAGE_TAG
          docker push $FRONTEND_ECR_REGISTRY:latest
      
      - name: Escribir summary del job (Frontend)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "## Resumen del job - Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- Job: ${GITHUB_JOB}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${JOB_STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "- Image tag: ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
  
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar credenciales AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Escribir la versión en el artefacto
        run: |
          # El despliegue siempre consume la imagen latest publicada por build.yml
          echo "latest" > .app-version
      
      - name: Preparar artefacto de CodeDeploy
        run: |
          # Empaqueta los archivos de despliegue en la raíz del .zip
          rm -rf bundle deploy.zip
          mkdir -p bundle
          cp .app-version docker-compose.yaml bundle/
          cp -r scripts bundle/
          (
            cd bundle
            zip -r ../deploy.zip .
          )
      
      - name: Subir artefacto a S3
        run: |
          aws s3 cp deploy.zip s3://${{ vars.S3_BUCKET }}/releases/${{ github.ref_name }}.zip

      - name: Crear deployment en CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ vars.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ vars.CODEDEPLOY_GROUP }} \
            --s3-location bucket=${{ vars.S3_BUCKET }},key=releases/${{ github.ref_name }}.zip,bundleType=zip \
            --description "Deploy ${{ github.ref_name }} (commit ${{ github.sha }})"